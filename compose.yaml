services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: santa
      POSTGRES_USER: santa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U santa -d santa']
      interval: 3s
      timeout: 3s
      retries: 20
  santa-go:
    build:
      context: .
      dockerfile: go/Dockerfile
    environment:
      DATABASE_URL: postgres://santa:${POSTGRES_PASSWORD}@db:5432/santa
      SANTA_GO_ADDR: :5080
      SANTA_GO_SECURE_COOKIES: "false"
    ports:
      - '127.0.0.1:5080:5080'
    depends_on:
      db:
        condition: service_healthy
  santa:
    profiles: [dotnet]
    build: .
    environment:
      ConnectionStrings__Santa: Host=db;Database=santa;Username=santa;Password=${POSTGRES_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - '127.0.0.1:5080:8080'
    volumes:
      - keys:/var/lib/santa/keys
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
  keys:
